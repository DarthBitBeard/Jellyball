# Repo-root pyproject.toml: tooling config only (ruff, mypy).
#
# Deliberately NOT placed at Jellyball/pyproject.toml and deliberately has no
# [project] table:
#   - PyInstaller builds via Jellyball/jellyball.spec, invoked by
#     Jellyball/build-installer.ps1 (which `Set-Location`s into Jellyball/ and
#     runs `pip install -r requirements-build.txt` + `pyinstaller jellyball.spec`).
#     A pyproject.toml with a [project] table sitting in that same directory
#     risks pip/setuptools treating Jellyball/ as an installable package (e.g.
#     if anything ever runs `pip install .` there); keeping this file out of
#     Jellyball/ and free of [project] avoids that entirely.
#   - The Docker build context is `./Jellyball` (see docker-compose.yml /
#     Dockerfile `COPY . .`), so a root-level pyproject.toml is never copied
#     into the image - no need to add it to Jellyball/.dockerignore.
#   - ruff/mypy still work fine run from the repo root with `Jellyball` as an
#     explicit target (see .github/workflows/ci.yml), or from within Jellyball/
#     since both tools search upward for pyproject.toml.

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Conservative rule set: every code below has ZERO violations against the
# current Jellyball/ source as of this file's addition (ruff 0.16.9). Nothing
# in source was changed to make that true - these were chosen because they
# already pass. See the commented list further down for rules that are close
# but currently have violations; they're left disabled on purpose.
select = [
    "E9",   # E901/E902/E999 - syntax errors, IndentationError, IOError
    "F63",  # F631-F634 - assert-on-tuple, %-format and comparison misuse
    "F7",   # F701-F707 - break/continue/return/yield outside proper context
    "F82",  # F821/F822 - undefined name, undefined name in __all__
    "F811", # redefinition of unused name from line N
    "B006", # mutable default argument (e.g. `def f(x=[])`)
    "B008", # function call in default argument
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection style (`Depends(...)`, `Form(...)`, etc. as a
# parameter default) is exactly what B008 exists to catch elsewhere, but it's
# the correct and required pattern for FastAPI route signatures. Without this,
# B008 flags main.py's `Depends(security)` / `Form(None)` defaults, which are
# not bugs. This keeps B008 enabled (see `select` above) with zero violations
# instead of leaving it disabled outright.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
]

