#   N802     invalid-function-name                       2
#   N806     non-lowercase-variable-in-function           4
#   N818     error-suffix-on-exception-name               1
#   SIM102   collapsible-if                               3
#   SIM103   needless-bool                                3
#   SIM109   compare-with-tuple                           1
#   SIM112   uncapitalized-environment-variables          3
#   SIM115   open-file-with-context-handler                2
#   SIM117   multiple-with-statements                     1
#   ERA001   commented-out-code                           1
#   UP012    unnecessary-encode-utf8                       2
#   PLW1510  subprocess-run-without-check                  3
#
# Larger/systemic (real cleanup or an intentional pattern worth discussing
# first - e.g. E402's 29 hits are main.py deliberately running startup/env
