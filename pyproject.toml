#   UP035    deprecated-import                              30
#   UP045    non-pep604-annotation-optional                  157
#   UP006    non-pep585-annotation                           327
#   ARG005   unused-lambda-argument                          2
#   ARG002   unused-method-argument                          25
#   ARG001   unused-function-argument                        51
#   PLC0415  import-outside-top-level                        48
#   PLR2004  magic-value-comparison                          79
