services:
  jellyball:
    # Default: the published image (linux/amd64). Pin a version for production,
    # e.g. JELLYBALL_IMAGE=ghcr.io/darthbitbeard/jellyball:2.1.0 in .env.
    image: ${JELLYBALL_IMAGE:-ghcr.io/darthbitbeard/jellyball:latest}
    # Fallback / local changes / non-amd64 hosts: `docker compose build` builds
    # this checkout and tags it with the image name above, so a following
    # `docker compose up -d` uses your local build (see docs/DOCKER.md).
    build:
      context: ./Jellyball
      dockerfile: Dockerfile
    container_name: jellyball
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    # Every setting in Jellyball/README.md's configuration table can go in a
    # .env file next to this compose file (copy .env.example; full annotated
    # template also lives at Jellyball/.env.example). The host ./data volume
    # must be writable by uid 1000 (the image's jellyball user).
    # Entries under `environment:` below are container plumbing and common overrides.
    env_file:
      - path: .env
        required: false
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /healthz is unauthenticated and in-memory; the image has the same
      # check built in, this makes it visible and tunable from compose.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      - PORT=8000
      - DB_FILE=/app/data/sports_proxy.db
      - JELLYBALL_DATA_DIR=/app/data
      - JELLYBALL_HEADLESS=1
      - JELLYBALL_HOST=0.0.0.0
      - MULTIVIEW_HWACCEL=${MULTIVIEW_HWACCEL:-none}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      # Leave empty to generate one (saved under /app/data/dashboard-password.txt).
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - STREAM_PROVIDER_PRIORITY=${STREAM_PROVIDER_PRIORITY:-}
      - STREAM_MAX_BANDWIDTH=${STREAM_MAX_BANDWIDTH:-}
