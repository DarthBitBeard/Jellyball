services:
  jellyball:
    build:
      context: ./Jellyball
      dockerfile: Dockerfile
    container_name: jellyball
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    # Every setting in Jellyball/README.md's configuration table can go in a
    # .env file next to this compose file (copy .env.example; full annotated
    # template also lives at Jellyball/.env.example). The host ./data volume
    # must be writable by uid 1000 (the image's jellyball user).
    # Entries under `environment:` below are container plumbing and common overrides.
    env_file:
      - path: .env
        required: false
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=8000
      - DB_FILE=/app/data/sports_proxy.db
      - JELLYBALL_DATA_DIR=/app/data
      - JELLYBALL_HEADLESS=1
      - JELLYBALL_HOST=0.0.0.0
      - MULTIVIEW_HWACCEL=${MULTIVIEW_HWACCEL:-none}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      # Leave empty to generate one (saved under /app/data/dashboard-password.txt).
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - STREAM_PROVIDER_PRIORITY=${STREAM_PROVIDER_PRIORITY:-}
      - STREAM_MAX_BANDWIDTH=${STREAM_MAX_BANDWIDTH:-}
