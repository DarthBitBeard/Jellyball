<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Live TV Channels</title>
  <link rel="stylesheet" href="https://cdn.example.test/assets/tv.css">
</head>
<body class="tv-index">
  <header class="site-header">
    <a class="logo" href="/">Live TV</a>
    <nav>
      <a href="/tv/">All channels</a>
      <a href="/about/">About</a>
    </nav>
  </header>

  <main>
    <h1>Live TV Channels</h1>
    <ul class="channel-list">
      <li class="channel"><a href="/tv/espn-live-stream/" title="Watch ESPN live"><img src="https://img.example.test/logos/espn.png" alt="ESPN"><span class="name">ESPN</span></a></li>
      <li class="channel"><a href="/tv/espn2-live-stream/" title="Watch ESPN2 live"><img src="https://img.example.test/logos/espn2.png" alt="ESPN2"><span class="name">ESPN2</span></a></li>
      <li class="channel"><a href="/tv/espnu-live-stream/" title="Watch ESPNU live"><img src="https://img.example.test/logos/espnu.png" alt="ESPNU"><span class="name">ESPNU</span></a></li>
      <li class="channel"><a href="/tv/espn-deportes-live-stream/" title="Watch ESPN Deportes live"><img src="https://img.example.test/logos/espn-deportes.png" alt="ESPN Deportes"><span class="name">ESPN Deportes</span></a></li>
      <li class="channel"><a href="/tv/fs1-live-stream/" title="Watch FS1 live"><img src="https://img.example.test/logos/fs1.png" alt="FS1"><span class="name">FS1</span></a></li>
      <li class="channel"><a href="/tv/nfl-network-live-stream/" title="Watch NFL Network live"><img src="https://img.example.test/logos/nfl-network.png" alt="NFL Network"><span class="name">NFL Network</span></a></li>
      <li class="channel"><a href="/tv/abc-news-live-stream/" title="Watch ABC News live"><img src="https://img.example.test/logos/abc-news.png" alt="ABC News"><span class="name">ABC News</span></a></li>
      <li class="channel"><a href="/tv/abc-live-stream/" title="Watch ABC live"><img src="https://img.example.test/logos/abc.png" alt="ABC"><span class="name">ABC</span></a></li>
    </ul>
  </main>
</body>
</html>
