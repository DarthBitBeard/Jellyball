<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Player</title>
  <style>html, body { margin: 0; background: #000; }</style>
</head>
<body>
  <div id="video"></div>

  <!-- A JW-Player-style setup call. Slashes are JSON-escaped, as many embeds emit them. -->
  <script>
    jwplayer("video").setup({
      file: "https:\/\/cdn.example.test\/hls\/gators-alt\/master.m3u8",
      type: "hls",
      autostart: true,
      image: "https:\/\/img.example.test\/posters\/gators-alt.jpg"
    });
  </script>

  <!-- A second frame nested one level deeper. -->
  <iframe src="https://embed.example.test/frame/gators-nested" allowfullscreen></iframe>
</body>
</html>
