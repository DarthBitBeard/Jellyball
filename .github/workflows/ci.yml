name: CI

on:
  push:
    branches:
      - master
      - "release-*"
  pull_request:
    branches:
      - master
      - "release-*"

# Jellyball targets Windows (Windows service, PyInstaller + Inno Setup
# installer), so windows-latest is the primary/required job. An ubuntu-latest
# job is also run because the unit suite has no Windows-only dependency: every
# Windows-specific usage in Jellyball/*.py is guarded by `sys.platform == "win32"` /
# `os.name == "nt"`, requirements.txt marks pywin32 itself
# `sys_platform == "win32"` (so pip simply skips it on Linux), and pystray/PIL
# (tray-icon mode) are imported lazily inside functions, never at module
# import time. Neither ffmpeg nor installed Playwright browsers are required
# for the unit suite: test_hls_session.py fakes segment "downloads" in
# memory, and test_scraper_hardening.py drives Playwright through fakes for
# Browser/BrowserContext/Page rather than a real browser.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Jellyball/requirements.txt

      - name: Install dependencies
        run: pip install -r Jellyball/requirements.txt

      - name: Run unit tests
        working-directory: Jellyball
        run: python -m unittest discover -p "test_*.py"

      - name: Install ruff
        run: pip install ruff==0.16.9

      - name: Lint (ruff)
        run: ruff check Jellyball

  # The jobs below are not required checks (the ruleset requires only the two
  # "test" jobs above). They are separate jobs so they cannot slow down or
  # break those.

  coverage:
    # Informational: the same unit suite under coverage.py. It runs several
    # times slower than the plain run, hence its own job. No minimum is enforced
    # yet; the numbers appear in the job summary and as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Jellyball/requirements.txt

      - name: Install dependencies
        run: pip install -r Jellyball/requirements.txt coverage==7.16.2

      - name: Run unit tests under coverage
        working-directory: Jellyball
        run: coverage run --rcfile=../pyproject.toml -m unittest discover -p "test_*.py"

      - name: Report
        working-directory: Jellyball
        run: |
          coverage xml --rcfile=../pyproject.toml -o ../coverage.xml
          {
            echo "### Unit-test coverage (informational)"
            echo
            coverage report --rcfile=../pyproject.toml --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  typecheck:
    # mypy on the modules listed under [tool.mypy] files in pyproject.toml, which
    # are the ones that are already clean. Add a module to that list once it passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Jellyball/requirements.txt

      - name: Install dependencies
        run: pip install -r Jellyball/requirements.txt mypy==2.4.0

      - name: Type-check
        run: mypy --config-file pyproject.toml

  unit-py313:
    # Early warning for the next Python. A failure here is informational and
    # does not block a merge.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: Jellyball/requirements.txt

      - name: Install dependencies
        run: pip install -r Jellyball/requirements.txt

      - name: Run unit tests
        working-directory: Jellyball
        run: python -m unittest discover -p "test_*.py"

  audit:
    # Known-vulnerability scan of the pinned runtime dependencies. Informational:
    # Dependabot proposes the fixes, this job just makes a problem visible.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r Jellyball/requirements.txt

  e2e:
    # Opt-in e2e tools (fake HLS origins + real ffmpeg). windows-latest matches
    # the primary target platform; skip gracefully if ffmpeg is missing.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Jellyball/requirements.txt

      - name: Install dependencies
        run: pip install -r Jellyball/requirements.txt

      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y
          ffmpeg -version

      - name: Run e2e tool wrappers
        working-directory: Jellyball
        shell: pwsh
        env:
          JELLYBALL_E2E: "1"
        run: python -m unittest test_e2e_tools -v

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

      - name: Smoke-run container healthcheck
        run: |
          # Image runs as uid 1000; the bind-mounted ./data must be writable.
          mkdir -p data
          sudo chown -R 1000:1000 data
          docker compose up -d
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' jellyball 2>/dev/null || echo starting)
            echo "health=$status"
            if [ "$status" = "healthy" ]; then
              docker compose down -v
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs
              docker compose down -v
              exit 1
            fi
            sleep 2
          done
          docker compose logs
          docker compose down -v
          exit 1
