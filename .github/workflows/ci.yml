name: CI

on:
  push:
    branches:
      - master
      - "release-*"
  pull_request:
    branches:
      - master
      - "release-*"

# Jellyball targets Windows (Windows service, PyInstaller + Inno Setup
# installer), so windows-latest is the primary/required job. An ubuntu-latest
# job is also run because the unit suite has no Windows-only dependency: every
# Windows-specific usage in Jellyball/*.py is guarded by `sys.platform == "win32"` /
# `os.name == "nt"`, requirements.txt marks pywin32 itself
# `sys_platform == "win32"` (so pip simply skips it on Linux), and pystray/PIL
# (tray-icon mode) are imported lazily inside functions, never at module
# import time. Neither ffmpeg nor installed Playwright browsers are required
# for the unit suite: test_hls_session.py fakes segment "downloads" in
# memory, and test_scraper_hardening.py drives Playwright through fakes for
# Browser/BrowserContext/Page rather than a real browser.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Jellyball/requirements.txt

      - name: Install dependencies
        run: pip install -r Jellyball/requirements.txt

      - name: Run unit tests
        working-directory: Jellyball
        run: python -m unittest discover -p "test_*.py"

      - name: Install ruff
        run: pip install ruff==0.16.9

      - name: Lint (ruff)
        run: ruff check Jellyball

  e2e:
    # Opt-in e2e tools (fake HLS origins + real ffmpeg). windows-latest matches
    # the primary target platform; skip gracefully if ffmpeg is missing.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Jellyball/requirements.txt

      - name: Install dependencies
        run: pip install -r Jellyball/requirements.txt

      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y
          ffmpeg -version

      - name: Run e2e tool wrappers
        working-directory: Jellyball
        shell: pwsh
        env:
          JELLYBALL_E2E: "1"
        run: python -m unittest test_e2e_tools -v

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

      - name: Smoke-run container healthcheck
        run: |
          mkdir -p data
          docker compose up -d
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' jellyball 2>/dev/null || echo starting)
            echo "health=$status"
            if [ "$status" = "healthy" ]; then
              docker compose down
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs
              docker compose down
              exit 1
            fi
            sleep 2
          done
          docker compose logs
          docker compose down
          exit 1
