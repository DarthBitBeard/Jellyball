version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/Jellyball"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "docker"
    directory: "/Jellyball"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"
